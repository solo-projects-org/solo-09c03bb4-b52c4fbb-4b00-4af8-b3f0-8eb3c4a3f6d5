services:
  web:
    build: .
    image: guide-ab-eval:latest
    ports:
      - "8000:8000"
    volumes:
      - guide-data:/data
    environment:
      APP_DB: /data/guide.db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/')"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  guide-data:
